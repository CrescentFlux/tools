<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>答案之书 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 560px;
    width: 100%;
    text-align: center;
}
.back-link {
    display: inline-block;
    margin-bottom: 40px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }

h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    font-weight: 700;
}
.desc {
    color: #888888;
    font-size: 0.9rem;
    margin-bottom: 48px;
}

/* 书 */
.book {
    width: 200px;
    height: 260px;
    margin: 0 auto 40px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s;
}
.book:hover { transform: translateY(-6px); }

.book-cover {
    width: 100%;
    height: 100%;
    background: #111111;
    border-radius: 8px 16px 16px 8px;
    position: relative;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
}
.book-cover::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 14px;
    height: 100%;
    background: #333333;
    border-radius: 8px 0 0 8px;
}
.book-cover::after {
    content: '?';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: 5rem;
    font-family: Georgia, serif;
    font-weight: 700;
}

.book.shaking {
    animation: shake 0.5s ease-in-out;
}
@keyframes shake {
    0%, 100% { transform: translateY(0) rotate(0); }
    20% { transform: translateY(-6px) rotate(-3deg); }
    40% { transform: translateY(0) rotate(3deg); }
    60% { transform: translateY(-4px) rotate(-2deg); }
    80% { transform: translateY(0) rotate(1deg); }
}

.hint {
    color: #888888;
    font-size: 0.9rem;
    margin-bottom: 16px;
}

/* 结果 */
.result {
    display: none;
    background: #f5f5f5;
    border-radius: 16px;
    padding: 40px 32px;
    animation: fadeIn 0.8s ease;
}
.result.show { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

.result-text {
    font-family: Georgia, 'Songti SC', serif;
    font-size: 1.3rem;
    line-height: 1.8;
    color: #111111;
    font-weight: 500;
}

.date-note {
    margin-top: 20px;
    font-size: 0.8rem;
    color: #aaaaaa;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>答案之书</h1>
    <p class="desc">心里想一个问题，然后翻开这本书</p>

    <div class="book" id="book" onclick="reveal()">
        <div class="book-cover"></div>
    </div>

    <p class="hint" id="hint">点击书本，得到答案</p>

    <div class="result" id="result">
        <div class="result-text" id="answerText"></div>
        <p class="date-note" id="dateNote"></p>
    </div>
</div>

function todayKey() {
    const d = new Date();
    return 'answer_' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function hasAnsweredToday() {
    return localStorage.getItem(todayKey()) !== null;
}

function showAnswer() {
    const saved = localStorage.getItem(todayKey());
    if (saved) {
        displayAnswer(saved);
        disableBook();
    }
}

function reveal() {
    if (hasAnsweredToday()) {
        document.getElementById('hint').textContent = '今天已经问过了，明天再来';
        return;
    }

    const book = document.getElementById('book');
    book.classList.add('shaking');

    setTimeout(() => {
        book.classList.remove('shaking');

        const answer = answers[Math.floor(Math.random() * answers.length)];
        localStorage.setItem(todayKey(), answer);
        displayAnswer(answer);
        disableBook();
    }, 600);
}

function displayAnswer(answer) {
    const result = document.getElementById('result');
    document.getElementById('answerText').textContent = answer;

    const d = new Date();
    document.getElementById('dateNote').textContent = '翻开于 ' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';

    result.classList.add('show');
}

function disableBook() {
    document.getElementById('book').style.opacity = '0.3';
    document.getElementById('book').style.cursor = 'not-allowed';
    document.getElementById('hint').textContent = '今天已经问过了，明天再来';
}

showAnswer();
