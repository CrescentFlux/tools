<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大小写转换 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 640px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }
textarea {
    width: 100%;
    min-height: 140px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    color: #111111;
    padding: 16px;
    font-size: 1rem;
    resize: vertical;
    transition: all 0.2s;
    font-family: inherit;
}
textarea:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}
.btn-row {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}
button {
    padding: 10px 18px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>大小写转换</h1>
    <p class="desc">输入文字，选择转换方式</p>

    <textarea id="input" placeholder="在这里输入或粘贴文字..."></textarea>

    <div class="btn-row">
        <button onclick="toUpper()">全部大写</button>
        <button onclick="toLower()">全部小写</button>
        <button onclick="toTitle()">首字母大写</button>
        <button onclick="toCamel()">驼峰命名</button>
        <button onclick="toSnake()">下划线命名</button>
        <button class="ghost" onclick="copyResult()">复制结果</button>
        <button class="ghost" onclick="clearAll()">清空</button>
    </div>

    <textarea id="output" placeholder="结果会显示在这里..." readonly></textarea>
</div>

<script>
function getInput() {
    return document.getElementById('input').value;
}
function setOutput(text) {
    document.getElementById('output').value = text;
}

function toUpper() {
    setOutput(getInput().toUpperCase());
}

function toLower() {
    setOutput(getInput().toLowerCase());
}

function toTitle() {
    setOutput(getInput().replace(/\b\w/g, c => c.toUpperCase()));
}

function toCamel() {
    const text = getInput().trim();
    const words = text.split(/[\s_-]+/).filter(Boolean);
    if (words.length === 0) { setOutput(''); return; }
    const result = words[0].toLowerCase() +
        words.slice(1).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('');
    setOutput(result);
}

function toSnake() {
    const text = getInput().trim();
    const result = text
        .replace(/([a-z])([A-Z])/g, '$1_$2')
        .replace(/[\s-]+/g, '_')
        .toLowerCase();
    setOutput(result);
}

function copyResult() {
    const output = document.getElementById('output');
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
        alert('已复制');
    });
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
}
</script>
</body>
</html>
