<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抛硬币 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 560px;
    width: 100%;
    text-align: center;
}
.back-link {
    display: inline-block;
    margin-bottom: 40px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 48px; }

.coin {
    width: 160px;
    height: 160px;
    margin: 0 auto 40px;
    border-radius: 50%;
    background: #111111;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}
.coin:hover { transform: translateY(-4px); }
.coin.flipping {
    animation: flip 0.8s ease-in-out;
}
@keyframes flip {
    0% { transform: rotateY(0); }
    50% { transform: rotateY(900deg) scale(1.1); }
    100% { transform: rotateY(1800deg); }
}

.result {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 24px;
    min-height: 40px;
}

.hint { color: #888888; font-size: 0.9rem; }

.history {
    margin-top: 32px;
    font-size: 0.9rem;
    color: #888888;
}
.history .item {
    display: inline-block;
    margin: 0 4px;
    font-family: monospace;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>抛硬币</h1>
    <p class="desc">点一下硬币，看正反</p>

    <div class="coin" id="coin" onclick="flip()">?</div>
    <div class="result" id="result"></div>
    <p class="hint" id="hint">点击硬币开始</p>

    <div class="history" id="history"></div>
</div>

<script>
let flipping = false;
let history = [];

function flip() {
    if (flipping) return;
    flipping = true;

    const coin = document.getElementById('coin');
    const result = document.getElementById('result');
    const hint = document.getElementById('hint');

    coin.classList.add('flipping');
    result.textContent = '';
    hint.textContent = '';

    setTimeout(() => {
        coin.classList.remove('flipping');
        const isHeads = Math.random() < 0.5;
        const text = isHeads ? '正' : '反';
        coin.textContent = text;
        result.textContent = isHeads ? '正面' : '反面';
        hint.textContent = '再点一下，继续';

        history.unshift(text);
        if (history.length > 10) history.pop();
        renderHistory();

        flipping = false;
    }, 800);
}

function renderHistory() {
    const el = document.getElementById('history');
    if (history.length === 0) {
        el.textContent = '';
        return;
    }
    el.innerHTML = '最近：' + history.map(t => `<span class="item">${t}</span>`).join('');
}
</script>
</body>
</html>
