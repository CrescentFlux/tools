<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本去重 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 640px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }
textarea {
    width: 100%;
    min-height: 160px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    color: #111111;
    padding: 16px;
    font-size: 0.95rem;
    font-family: monospace;
    resize: vertical;
    transition: all 0.2s;
}
textarea:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}
.btn-row {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}
button {
    padding: 10px 18px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }
.stats {
    color: #888888;
    font-size: 0.85rem;
    margin-top: 12px;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>文本去重</h1>
    <p class="desc">粘贴多行文本，自动删掉重复行</p>

    <textarea id="input" placeholder="每行一条，粘贴进去..."></textarea>

    <div class="btn-row">
        <button onclick="dedupe()">去重</button>
        <button class="ghost" onclick="copyResult()">复制结果</button>
        <button class="ghost" onclick="clearAll()">清空</button>
    </div>

    <textarea id="output" placeholder="去重后的结果..." readonly></textarea>
    <p class="stats" id="stats"></p>
</div>

<script>
function dedupe() {
    const input = document.getElementById('input').value;
    const lines = input.split('\n');
    const seen = new Set();
    const result = [];

    for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed === '') continue;
        if (!seen.has(trimmed)) {
            seen.add(trimmed);
            result.push(trimmed);
        }
    }

    document.getElementById('output').value = result.join('\n');
    document.getElementById('stats').textContent =
        '原 ' + lines.filter(l => l.trim() !== '').length + ' 行 → 去重后 ' + result.length + ' 行';
}

function copyResult() {
    const output = document.getElementById('output');
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
        alert('已复制');
    });
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
    document.getElementById('stats').textContent = '';
}
</script>
</body>
</html>
