<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 900px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }

.input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
}
.input-col label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 8px;
    font-weight: 500;
}
textarea {
    width: 100%;
    min-height: 200px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    color: #111111;
    padding: 14px;
    font-size: 0.9rem;
    font-family: monospace;
    resize: vertical;
    transition: all 0.2s;
}
textarea:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}

.btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
button {
    padding: 10px 20px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }

.result {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 20px;
    font-family: monospace;
    font-size: 0.9rem;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 100px;
}
.result .same { color: #111111; }
.result .removed {
    color: #cc4444;
    text-decoration: underline;
    text-decoration-color: #cc4444;
    text-underline-offset: 3px;
    background: rgba(204, 68, 68, 0.06);
}
.result .added {
    color: #228844;
    background: rgba(34, 136, 68, 0.08);
}
.result .empty {
    color: #aaaaaa;
}
.stats {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #888888;
}
@media (max-width: 768px) {
    .input-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>文本对比</h1>
    <p class="desc">粘贴两段文字，高亮不同之处</p>

    <div class="input-row">
        <div class="input-col">
            <label>原文</label>
            <textarea id="left" placeholder="粘贴第一段文字..."></textarea>
        </div>
        <div class="input-col">
            <label>其他</label>
            <textarea id="right" placeholder="粘贴第二段文字..."></textarea>
        </div>
    </div>

    <div class="btn-row">
        <button onclick="compare()">对比</button>
        <button class="ghost" onclick="clearAll()">清空</button>
    </div>

    <div class="result" id="result">
        <span class="empty">对比结果会显示在这里</span>
    </div>
    <p class="stats" id="stats"></p>
</div>

<script>
function compare() {
    const left = document.getElementById('left').value;
    const right = document.getElementById('right').value;
    const result = document.getElementById('result');
    const stats = document.getElementById('stats');

    if (!left && !right) {
        result.innerHTML = '<span class="empty">请先输入两段文字</span>';
        stats.textContent = '';
        return;
    }

    const leftLines = left.split('\n');
    const rightLines = right.split('\n');
    const maxLen = Math.max(leftLines.length, rightLines.length);

    let html = '';
    let added = 0;
    let removed = 0;

    for (let i = 0; i < maxLen; i++) {
        const l = leftLines[i] !== undefined ? leftLines[i] : null;
        const r = rightLines[i] !== undefined ? rightLines[i] : null;

        if (l === r) {
            html += '<span class="same">' + escapeHtml(l || '') + '</span>\n';
        } else {
            if (l !== null) {
                html += '<span class="removed">- ' + escapeHtml(l) + '</span>\n';
                removed++;
            }
            if (r !== null) {
                html += '<span class="added">+ ' + escapeHtml(r) + '</span>\n';
                added++;
            }
        }
    }

    result.innerHTML = html;
    stats.textContent = '新增 ' + added + ' 行，删除 ' + removed + ' 行';
}

function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function clearAll() {
    document.getElementById('left').value = '';
    document.getElementById('right').value = '';
    document.getElementById('result').innerHTML = '<span class="empty">对比结果会显示在这里</span>';
    document.getElementById('stats').textContent = '';
}
</script>
</body>
</html>
