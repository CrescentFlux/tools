<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji 混排 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 640px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }
textarea {
    width: 100%;
    min-height: 120px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    color: #111111;
    padding: 16px;
    font-size: 1rem;
    resize: vertical;
    font-family: inherit;
    transition: all 0.2s;
}
textarea:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}

.btn-row {
    display: flex;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
}
button {
    padding: 10px 18px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }
.mode-btn {
    background: #ffffff;
    color: #111111;
    border: 1px solid #e0e0e0;
}
.mode-btn.active {
    background: #111111;
    color: #ffffff;
    border-color: #111111;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>Emoji 混排</h1>
    <p class="desc">把普通文字转成 emoji 混搭风格</p>

    <textarea id="input" placeholder="在这里输入文字..."></textarea>
    <div class="btn-row">
    <button class="mode-btn active" id="mode-light" onclick="setMode('light')">轻混</button>
    <button class="mode-btn" id="mode-heavy" onclick="setMode('heavy')">重混</button>
    <button class="mode-btn" id="mode-tail" onclick="setMode('tail')">句尾</button>
        </div>
    <div class="btn-row">
        <button onclick="mixEmoji()">混排</button>
        <button class="ghost" onclick="copyResult()">复制结果</button>
        <button class="ghost" onclick="clearAll()">清空</button>
    </div>

    <textarea id="output" placeholder="结果会显示在这里..." readonly></textarea>
</div>

<script>
const themes = {
    a: ['🌿', '🍃', '🌱', '🌾', '🪴', '🌵', '🍀', '🪷', '🌊', '💧', '🫧', '❄️', '🌙', '🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗'],
    b: ['🌘', '🌚', '🌛', '🌜', '🪐', '🎐', '🧶', '☁️', '🌫️', '🌪️', '🌬️', '⛅', '🌥️', '🌦️', '🌧️', '⛈️', '🌩️', '🪾', '🌬️', '🌀'],
    c: ['🕊️', '🦢', '🦩', '🦚', '🦜', '🐚', '🪸', '🪨', '🪵', '🌾', '🌿', '🍂', '🍃', '🌱', '🪴', '🌵', '🎋', '🎍', '🪹', '🪺'],
    d: ['⚪', '⚫', '🔘', '🔳', '🔲', '◾', '◽', '▪️', '▫️', '🟤', '🟣', '🔵', '🟢', '🪞', '🔧', '🔩', '🪑', '🌀', '🔮', '🌨️']
};

let currentMode = 'light';
let currentTheme = 'warm';

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + mode).classList.add('active');
    mixEmoji();
}

function mixEmoji() {
    const input = document.getElementById('input').value;
    const output = document.getElementById('output');
    if (!input) {
        output.value = '先输入文字';
        return;
    }

    const themeKeys = Object.keys(themes);
    currentTheme = themeKeys[Math.floor(Math.random() * themeKeys.length)];
    const emojiList = themes[currentTheme];

    let result = '';

    if (currentMode === 'light') {
        for (const char of input) {
            result += char;
            if (char.trim() !== '' && Math.random() < 0.4) {
                result += emojiList[Math.floor(Math.random() * emojiList.length)];
            }
        }
    } else if (currentMode === 'heavy') {
        for (const char of input) {
            result += char;
            if (char.trim() !== '') {
                result += emojiList[Math.floor(Math.random() * emojiList.length)];
            }
        }
    } else if (currentMode === 'tail') {
        result = input + ' ';
        for (let i = 0; i < 8; i++) {
            result += emojiList[Math.floor(Math.random() * emojiList.length)];
        }
    }

    output.value = result;
}

function copyResult() {
    const output = document.getElementById('output');
    if (!output.value) return;
    navigator.clipboard.writeText(output.value).then(() => {
        alert('已复制');
    });
}

function clearAll() {
    document.getElementById('input').value = '';
    document.getElementById('output').value = '';
}
</script>
</body>
</html>
