<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools · CrescentFlux</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    padding: 80px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container {
    max-width: 900px;
    width: 100%;
}

h1 {
    font-size: 2.4rem;
    margin-bottom: 12px;
    color: #111111;
    letter-spacing: -0.5px;
    font-weight: 700;
}

.subtitle {
    color: #0b0a0a;
    margin-bottom: 56px;
    font-size: 1rem;
}

.tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
}

.tool-card {
    display: block;
    background: #111111;
    color: #ffffff;
    border-radius: 16px;
    padding: 32px 28px;
    text-decoration: none;
    transition: all 0.3s;
    border: 1px solid #111111;
}

.tool-card:hover {
    background: #000000;
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
}

.tool-card h3 {
    color: #ffffff;
    font-size: 1.2rem;
    margin-bottom: 10px;
    font-weight: 600;
}

.tool-card p {
    color: #aaaaaa;
    font-size: 0.9rem;
    line-height: 1.6;
}

@media (max-width: 768px) {
    body { padding: 50px 20px; }
    h1 { font-size: 1.9rem; }
    .tool-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
    <h1>Tools</h1>
    <p class="subtitle">一些自己会用的小工具</p>

    <div class="tool-grid">
        <a class="tool-card" href="qrcode.html">
            <h3>文字转二维码</h3>
            <p>输入文字或链接，生成二维码并下载。</p>
        </a>

        <a class="tool-card" href="morse.html">
            <h3>摩斯电码转换</h3>
            <p>文字 ↔ 摩斯电码，支持单词分隔。</p>
        </a>
    </div>
</div>
</body>
</html>
