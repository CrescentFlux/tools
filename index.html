<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools · CrescentFlux</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  background: #0a192f;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(100,217,254,0.05) 0%, transparent 20%),
    radial-gradient(circle at 80% 70%, rgba(72,187,255,0.03) 0%, transparent 20%);
  color: #e6f1ff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.hub-container {
  max-width: 1100px;
  width: 100%;
  background: rgba(15, 25, 45, 0.9);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 40px;
  border: 1px solid rgba(100, 217, 254, 0.2);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  margin: 0 auto;
}
h1 {
  text-align: center;
  font-size: 2.8rem;
  margin-bottom: 20px;
  background: linear-gradient(90deg, #64d9fe, #48bbff);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  text-align: center;
  color: #a5b4cb;
  margin-bottom: 40px;
  font-size: 1.1rem;
}
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-top: 30px;
}
.tool-card {
  display: block;
  background: rgba(25, 35, 55, 0.8);
  border: 1px solid rgba(100, 217, 254, 0.2);
  border-radius: 12px;
  padding: 24px;
  text-decoration: none;
  transition: all 0.3s;
}
.tool-card:hover {
  background: rgba(40, 50, 70, 0.9);
  transform: translateY(-4px);
  border-color: rgba(100, 217, 254, 0.5);
  box-shadow: 0 10px 30px rgba(100, 217, 254, 0.15);
}
.tool-card h3 {
  color: #dbeafe;
  font-size: 1.2rem;
  margin-bottom: 8px;
}
.tool-card p {
  color: #a5b4cb;
  font-size: 0.95rem;
}
@media (max-width: 768px) {
  .hub-container { padding: 25px; }
  h1 { font-size: 2.2rem; }
}
</style>
</head>
<body>
<div class="hub-container">
  <h1>🧰 Tools 工具集</h1>
  <p class="subtitle">一些我自己会用的小工具 · Small tools I actually use</p>

  <a class="tool-card" href="qrcode.html">
  <h3>文字转二维码</h3>
  <p>输入文字或链接，生成二维码并下载。</p>
</a>

<a class="tool-card" href="morse.html">
  <h3>摩斯电码转换</h3>
  <p>文字 ↔ 摩斯电码，支持单词分隔。</p>
</a>
</div>
</body>
</html>
