<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 640px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }

.field { margin-bottom: 24px; }
.field label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 8px;
    font-weight: 500;
}
input[type="range"] { width: 100%; }

.checkbox-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
}
.checkbox-row label {
    display: flex;
    align-items: center;
    font-size: 0.9rem;
    cursor: pointer;
}
.checkbox-row input {
    margin-right: 8px;
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.result-box {
    background: #111111;
    color: #ffffff;
    border-radius: 14px;
    padding: 24px;
    font-family: monospace;
    font-size: 1.2rem;
    word-break: break-all;
    text-align: center;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
button {
    padding: 12px 24px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }

.strength {
    margin-top: 16px;
    font-size: 0.85rem;
    color: #888888;
    text-align: center;
}


</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>密码生成</h1>
    <p class="desc">生成随机强密码</p>

    <div class="field">
        <label>长度：<span id="lengthVal">16</span></label>
        <input type="range" id="length" min="6" max="64" value="16">
    </div>

    <div class="checkbox-row">
        <label><input type="checkbox" id="upper" checked> 大写字母</label>
        <label><input type="checkbox" id="lower" checked> 小写字母</label>
        <label><input type="checkbox" id="number" checked> 数字</label>
        <label><input type="checkbox" id="symbol" checked> 符号</label>
    </div>

    <div class="result-box" id="result">点击生成</div>

    <div class="btn-row">
        <button onclick="generate()">生成密码</button>
        <button class="ghost" onclick="copyPassword()">复制</button>
    </div>

    <p class="strength" id="strength"></p>

</div>

<script>
const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
const numberChars = '0123456789';
const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

document.getElementById('length').addEventListener('input', e => {
    document.getElementById('lengthVal').textContent = e.target.value;
});

function generate() {
    const length = parseInt(document.getElementById('length').value);
    const useUpper = document.getElementById('upper').checked;
    const useLower = document.getElementById('lower').checked;
    const useNumber = document.getElementById('number').checked;
    const useSymbol = document.getElementById('symbol').checked;

    let pool = '';
    if (useUpper) pool += upperChars;
    if (useLower) pool += lowerChars;
    if (useNumber) pool += numberChars;
    if (useSymbol) pool += symbolChars;

    if (pool === '') {
        document.getElementById('result').textContent = '请至少选一种字符类型';
        document.getElementById('strength').textContent = '';
        return;
    }

    let password = '';
    const array = new Uint32Array(length);
    crypto.getRandomValues(array);

    for (let i = 0; i < length; i++) {
        password += pool[array[i] % pool.length];
    }

    document.getElementById('result').textContent = password;

    // 强度评估（按信息熵）密码强度真正的指标是信息熵，单位是比特（bit）熵 = 长度 × log2(字符池大小)
const entropy = length * Math.log2(pool.length);
let strength = '';
let strengthColor = '#888888';
if (entropy < 40) {
    strength = '弱';
    strengthColor = '#cc4444';
} else if (entropy < 60) {
    strength = '中';
    strengthColor = '#cc8844';
} else if (entropy < 80) {
    strength = '强';
    strengthColor = '#44aa44';
} else if (entropy < 100) {
    strength = '很强';
    strengthColor = '#2288cc';
} else {
    strength = '极强';
    strengthColor = '#111111';
}
document.getElementById('strength').textContent = '强度：' + strength + '（' + Math.round(entropy) + ' bit）';
document.getElementById('strength').style.color = strengthColor;}

function copyPassword() {
    const text = document.getElementById('result').textContent;
    if (!text || text === '点击生成') return;
    navigator.clipboard.writeText(text).then(() => {
        alert('已复制到剪贴板');
    });
}
</script>
</body>
</html>
