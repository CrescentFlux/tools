<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海报化 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 900px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
}
.back-link:hover { color: #111111; }
h1 { font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
.desc { color: #888888; font-size: 0.9rem; margin-bottom: 32px; }
.field { margin-bottom: 20px; }
.field label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 8px;
    font-weight: 500;
}
input[type="file"] {
    width: 100%;
    padding: 14px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
}
input[type="range"] { width: 100%; }
button {
    padding: 12px 24px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover { background: #000000; }
button.ghost {
    background: #ffffff;
    color: #111111;
}
button.ghost:hover { background: #f5f5f5; }
.btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.preview {
    margin-top: 28px;
    padding: 20px;
    background: #f5f5f5;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 200px;
}
.preview canvas {
    max-width: 100%;
    border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>海报化</h1>
    <p class="desc">减少颜色层次，做成色块风格，可下载</p>

    <div class="field">
        <label>选择图片</label>
        <input type="file" id="file" accept="image/*">
    </div>

    <div class="field">
        <label>颜色层次：<span id="levelsVal">5</span></label>
        <input type="range" id="levels" min="2" max="12" value="5">
    </div>

    <div class="btn-row">
        <button onclick="convert()">生成</button>
        <button class="ghost" onclick="download()">下载</button>
    </div>

    <div class="preview">
        <canvas id="canvas" style="display:none;"></canvas>
        <span id="placeholder" style="color:#888;">上传图片后点击“生成”</span>
    </div>
</div>

<script>
document.getElementById('levels').addEventListener('input', e => {
    document.getElementById('levelsVal').textContent = e.target.value;
});

function convert() {
    const file = document.getElementById('file').files[0];
    if (!file) { alert('请先选择图片'); return; }

    const levels = parseInt(document.getElementById('levels').value);
    const reader = new FileReader();

    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const step = 255 / (levels - 1);

            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.round(data[i] / step) * step;
                data[i + 1] = Math.round(data[i + 1] / step) * step;
                data[i + 2] = Math.round(data[i + 2] / step) * step;
            }

            ctx.putImageData(imageData, 0, 0);
            canvas.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function download() {
    const canvas = document.getElementById('canvas');
    if (canvas.style.display === 'none') { alert('请先生成'); return; }
    const link = document.createElement('a');
    link.download = 'poster.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}
</script>
</body>
</html>
