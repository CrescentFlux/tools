<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转二维码 · CrescentFlux</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a192f;
  color: #e6f1ff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.hub-container {
  max-width: 900px;
  width: 100%;
  background: rgba(15, 25, 45, 0.9);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 40px;
  border: 1px solid rgba(100, 217, 254, 0.2);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}
h1 { font-size: 1.8rem; margin-bottom: 20px; color: #64d9fe; }
textarea {
  width: 100%;
  min-height: 120px;
  background: rgba(10, 20, 40, 0.8);
  border: 1px solid rgba(100, 217, 254, 0.3);
  border-radius: 10px;
  color: #e6f1ff;
  padding: 15px;
  font-size: 1rem;
  resize: vertical;
}
textarea:focus { outline: none; border-color: #64d9fe; }
.btn-row { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
button {
  padding: 10px 20px;
  background: rgba(100, 217, 254, 0.1);
  border: 1px solid rgba(100, 217, 254, 0.3);
  border-radius: 8px;
  color: #64d9fe;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
}
button:hover { background: rgba(100, 217, 254, 0.2); }
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #a5b4cb;
  text-decoration: none;
  font-size: 0.95rem;
}
.back-link:hover { color: #64d9fe; }
#qrcode {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  padding: 20px;
  background: #fff;
  border-radius: 12px;
  min-height: 100px;
}
#qrcode img, #qrcode canvas { display: block; }
</style>
</head>
<body>
<div class="hub-container">
  <a class="back-link" href="index.html">← 返回工具集</a>
  <h1>文字转二维码</h1>

  <textarea id="input" placeholder="输入要生成二维码的文字或链接..."></textarea>

  <div class="btn-row">
    <button onclick="generate()">生成二维码</button>
    <button onclick="downloadQR()">下载图片</button>
  </div>

  <div id="qrcode"></div>
</div>

<!-- 引入二维码生成库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let qrInstance = null;

function generate() {
  const text = document.getElementById('input').value.trim();
  const container = document.getElementById('qrcode');
  container.innerHTML = '';

  if (!text) {
    container.innerHTML = '<p style="color:#333;">请先输入文字</p>';
    return;
  }

  qrInstance = new QRCode(container, {
    text: text,
    width: 256,
    height: 256,
    colorDark: '#0a192f',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
}

function downloadQR() {
  const canvas = document.querySelector('#qrcode canvas');
  if (!canvas) {
    alert('请先生成二维码');
    return;
  }
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
