<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转二维码 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 640px;
    width: 100%;
}
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.2s;
}
.back-link:hover { color: #111111; }
h1 {
    font-size: 1.8rem;
    margin-bottom: 24px;
    color: #111111;
    font-weight: 700;
}
textarea {
    width: 100%;
    min-height: 120px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    color: #111111;
    padding: 16px;
    font-size: 1rem;
    resize: vertical;
    font-family: inherit;
}
textarea:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}
.btn-row {
    display: flex;
    gap: 12px;
    margin: 20px 0;
    flex-wrap: wrap;
}
button {
    padding: 12px 24px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
button:hover {
    background: #000000;
}
#qrcode {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    padding: 24px;
    background: #f5f5f5;
    border-radius: 16px;
    min-height: 100px;
}
#qrcode img, #qrcode canvas { display: block; }
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>文字转二维码</h1>

    <textarea id="input" placeholder="输入要生成二维码的文字或链接..."></textarea>

    <div class="btn-row">
        <button onclick="generate()">生成二维码</button>
        <button onclick="downloadQR()">下载图片</button>
    </div>

    <div id="qrcode"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
let qrInstance = null;

function generate() {
    const text = document.getElementById('input').value.trim();
    const container = document.getElementById('qrcode');
    container.innerHTML = '';

    if (!text) {
        container.innerHTML = '<p style="color:#888;">请先输入文字</p>';
        return;
    }

    qrInstance = new QRCode(container, {
        text: text,
        width: 256,
        height: 256,
        colorDark: '#111111',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
    });
}

function downloadQR() {
    const canvas = document.querySelector('#qrcode canvas');
    if (!canvas) {
        alert('请先生成二维码');
        return;
    }
    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}
</script>
</body>
</html>
