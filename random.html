<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机数生成 · Tools</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container { max-width: 640px; width: 100%; }
.back-link {
    display: inline-block;
    margin-bottom: 32px;
    color: #888888;
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.2s;
}
.back-link:hover { color: #111111; }
h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    color: #111111;
    font-weight: 700;
}
.desc {
    color: #888888;
    font-size: 0.9rem;
    margin-bottom: 32px;
}
.field { margin-bottom: 20px; }
.field label {
    display: block;
    font-size: 0.9rem;
    color: #111111;
    margin-bottom: 8px;
    font-weight: 500;
}
input {
    width: 100%;
    padding: 14px 16px;
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    color: #111111;
    font-size: 1rem;
    font-family: monospace;
    transition: all 0.2s;
}
input:focus {
    outline: none;
    border-color: #111111;
    background: #ffffff;
}
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
button {
    padding: 14px 24px;
    background: #111111;
    border: 1px solid #111111;
    border-radius: 10px;
    color: #ffffff;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    width: 100%;
    margin-top: 8px;
}
button:hover { background: #000000; }
.result-box {
    margin-top: 28px;
    padding: 24px;
    background: #111111;
    border-radius: 12px;
    color: #ffffff;
    font-family: monospace;
    font-size: 1.4rem;
    text-align: center;
    word-break: break-all;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.result-box.multi {
    font-size: 1rem;
    line-height: 1.8;
    text-align: left;
    white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← 返回工具集</a>
    <h1>随机数生成</h1>
    <p class="desc">生成指定范围内的随机数</p>

    <div class="row">
        <div class="field">
            <label>最小值</label>
            <input type="number" id="min" value="1">
        </div>
        <div class="field">
            <label>最大值</label>
            <input type="number" id="max" value="100">
        </div>
    </div>

    <div class="field">
        <label>生成几个</label>
        <input type="number" id="count" value="1" min="1" max="100">
    </div>

    <div class="field">
        <label>
            <input type="checkbox" id="unique" style="width:auto; margin-right:8px;">
            不重复
        </label>
    </div>

    <button onclick="generate()">生成</button>

    <div class="result-box" id="result">—</div>
</div>

<script>
function generate() {
    const min = parseInt(document.getElementById('min').value);
    const max = parseInt(document.getElementById('max').value);
    const count = parseInt(document.getElementById('count').value);
    const unique = document.getElementById('unique').checked;
    const resultBox = document.getElementById('result');

    if (isNaN(min) || isNaN(max) || isNaN(count)) {
        resultBox.textContent = '请填写完整的数字';
        return;
    }
    if (min > max) {
        resultBox.textContent = '最小值不能大于最大值';
        return;
    }
    if (count < 1) {
        resultBox.textContent = '数量至少为 1';
        return;
    }
    if (unique && count > (max - min + 1)) {
        resultBox.textContent = '范围内没有这么多不重复的数';
        return;
    }

    const results = [];
    if (unique) {
        const pool = [];
        for (let i = min; i <= max; i++) pool.push(i);
        for (let i = 0; i < count; i++) {
            const idx = Math.floor(Math.random() * pool.length);
            results.push(pool.splice(idx, 1)[0]);
        }
    } else {
        for (let i = 0; i < count; i++) {
            results.push(Math.floor(Math.random() * (max - min + 1)) + min);
        }
    }

    if (count === 1) {
        resultBox.classList.remove('multi');
        resultBox.textContent = results[0];
    } else {
        resultBox.classList.add('multi');
        resultBox.textContent = results.join('  ');
    }
}
</script>
</body>
</html>
